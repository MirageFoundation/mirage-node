name: frontend

on:
  push:
    branches:
      - dev
    paths:
      - 'web/frontend/**'
      - 'docs/FAQ.md'
      - 'deploy/Dockerfile'
      - 'deploy/templates/caddy/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'web/frontend/**'
      - 'docs/FAQ.md'
      - 'deploy/Dockerfile'
      - 'deploy/templates/caddy/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Check PoW assets
        run: npm run check:pow-assets

      # Whole tree, errors only. The strict gate keeps a warning-free floor on the
      # security-critical modules; widen that list as files are cleaned up.
      - name: Lint (all sources)
        run: npm run lint

      - name: Lint (strict, zero warnings)
        run: npm run lint:strict

      - name: Unit tests
        run: npm run test

      # Reverting any of the 2026-08-14 security fixes must break a test, not
      # slip through a suite that only exercises the happy path.
      - name: Security regression mutation probe
        run: npm run check:mutation

      - name: Production build
        env:
          VITE_APP_VERSION: ci (${{ github.sha }})
          VITE_API_BASE: /api
        run: npm run build

      - name: Bundle policy
        run: npm run check:bundle-policy

      - name: Build reproducibility
        run: npm run check:repro

      - name: Response headers
        run: npm run check:headers

      - name: Audit (moderate+, allowlisted)
        run: npm run check:audit

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (mocked)
        env:
          VITE_APP_VERSION: ci (${{ github.sha }})
          VITE_API_BASE: /api
        run: npm run test:e2e
