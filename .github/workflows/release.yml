# Candidate image build. Run this manually on the reviewed dev commit, then
# offline-sign and commit its manifest before /prod merges and tags the release.
# Installer and updater pull by digest, never from convenience pointers.
#
# Arm64 is a native-runner spike, not QEMU. Until that spike lands this job
# publishes linux/amd64 only.
name: release-candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The candidate manifest needs the previous tag, so a shallow clone
          # will not do.
          fetch-depth: 0

      - name: Read VERSION and the previous release
        id: version
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          prev=$(python3 - "$v" <<'PY'
          import re, subprocess, sys
          current = tuple(map(int, sys.argv[1][1:].split(".")))
          versions = []
          for tag in subprocess.check_output(["git", "tag", "--list", "v*.*.*"], text=True).splitlines():
              if re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  parsed = tuple(map(int, tag[1:].split(".")))
                  if parsed < current:
                      versions.append((parsed, tag))
          print(max(versions)[1] if versions else "")
          PY
          )
          if [ -z "$prev" ]; then
            echo "ERROR: no release tag below $v; cannot state min_prior_version" >&2
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"

      - name: Verify signed network manifest
        run: python3 deploy/release_verify.py verify --manifest release/network.json --pubkey deploy/hosttools/pubkey.pem

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: blockchain/go.mod
          cache-dependency-path: blockchain/go.sum

      - name: Build chain binaries
        run: make -C blockchain build-all

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push candidate (amd64)
        id: build
        run: |
          image="ghcr.io/miragefoundation/mirage-node:sha-${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --provenance=true \
            --sbom=true \
            --build-arg "GIT_BRANCH=${GITHUB_REF_NAME}" \
            --build-arg "GIT_HASH=${GITHUB_SHA}" \
            -f deploy/Dockerfile \
            -t "$image" \
            --metadata-file /tmp/build-meta.json \
            .
          digest=$(python3 -c 'import json; print(json.load(open("/tmp/build-meta.json"))["containerimage.digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Keyless Sigstore sign (additional, not required for install)
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "ERROR: build produced no digest" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/miragefoundation/mirage-node@${digest}"

      - name: Verify installer payload in candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="ghcr.io/miragefoundation/mirage-node@${DIGEST}"
          docker pull "$image"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            -e "EXPECTED_VERSION=${VERSION}" \
            --entrypoint /bin/bash \
            "$image" -lc '
              set -e
              test "$(cat /opt/mirage/VERSION)" = "$EXPECTED_VERSION"
              test -f /opt/mirage/deploy/install.sh
              test -f /opt/mirage/deploy/release_verify.py
              test -f /opt/mirage/deploy/hosttools/mirage-launch
              test -f /opt/mirage/deploy/hosttools/mirage-update
              test -f /opt/mirage/release/network.json
              test -f /opt/mirage/release/network.json.sig
            '

      # Unsigned on purpose. The offline key never touches CI, so the foundation
      # reviews this artifact, sets activation/upgrade_name, and signs it.
      - name: Write unsigned release manifest artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          COMMIT: ${{ github.sha }}
          RELEASE_ID: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          digest = os.environ["DIGEST"]
          if not digest.startswith("sha256:"):
              raise SystemExit(f"unexpected digest {digest!r}")
          manifest = {
              "version": os.environ["VERSION"],
              "release_id": int(os.environ["RELEASE_ID"]),
              "commit": os.environ["COMMIT"],
              "image": f"ghcr.io/miragefoundation/mirage-node@{digest}",
              "min_prior_version": os.environ["PREVIOUS"],
              "activation": "ordinary",
              "upgrade_name": "",
              "rollback_safe": False,
              "consensus_breaking": False,
          }
          open("release-manifest.candidate.json", "w", encoding="utf-8").write(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-manifest-candidate
          path: release-manifest.candidate.json

  published-manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed manifests and release ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 deploy/release_verify.py verify \
            --manifest release/network.json \
            --pubkey deploy/hosttools/pubkey.pem
          python3 deploy/release_verify.py verify \
            --manifest release/manifest.json \
            --pubkey deploy/hosttools/pubkey.pem
          readarray -t fields < <(python3 - <<'PY'
          import json
          manifest = json.load(open("release/manifest.json"))
          print(manifest["version"])
          print(manifest["commit"])
          PY
          )
          version="${fields[0]}"
          candidate_commit="${fields[1]}"
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "ERROR: tag $RELEASE_TAG does not match manifest version $version" >&2
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < VERSION)" != "$version" ]; then
            echo "ERROR: VERSION does not match release manifest $version" >&2
            exit 1
          fi
          git cat-file -e "${candidate_commit}^{commit}"
          unexpected=$(git diff --name-only "$candidate_commit"..HEAD \
            | python3 -c 'import re,sys; print("\n".join(p for p in sys.stdin.read().splitlines() if not re.fullmatch(r"release/manifest\.json(?:\.sig)?", p)))')
          if [ -n "$unexpected" ]; then
            echo "ERROR: files changed after the candidate image was built:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Verify published image payload
        run: |
          python3 - <<'PY'
          import json
          from scripts.finalize_release_manifest import check_image
          check_image(json.load(open("release/manifest.json")))
          PY
