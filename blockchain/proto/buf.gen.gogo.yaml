# buf.gen.gogo.yaml - Protobuf generation config for Go types
#
version: v2
plugins:
  - local: ["go", "tool", "github.com/cosmos/gogoproto/protoc-gen-gocosmos"]
    out: .
    opt:
      - plugins=grpc
      - module=mirage
      - Mgoogle/protobuf/any.proto=github.com/cosmos/gogoproto/types/any
      # gogo marshalers need the gogo FieldMask, not the API-v2 fieldmaskpb type,
      # which has no Marshal/Size/Unmarshal methods.
      - Mgoogle/protobuf/field_mask.proto=github.com/cosmos/gogoproto/types
      - Mcosmos/orm/v1/orm.proto=cosmossdk.io/orm
      - Mcosmos/app/v1alpha1/module.proto=cosmossdk.io/api/cosmos/app/v1alpha1
  - local:
      [
        "go",
        "tool",
        "github.com/grpc-ecosystem/grpc-gateway/protoc-gen-grpc-gateway",
      ]
    out: .
    opt:
      - logtostderr=true
      - allow_colon_final_segments=true
      - module=mirage
