syntax = "proto3";
package mirage.core.v1;

option go_package = "mirage/x/core/types";

import "amino/amino.proto";
import "gogoproto/gogo.proto";

// TierConfig defines the configuration for a membership tier.
message TierConfig {
  option (gogoproto.equal) = true;

  // uint64 fields
  uint64 period_fee = 1;
  reserved 2; // was max_enabled_agents
  uint64 max_followed_users = 3;
  uint64 max_joined_communities = 4;
  uint64 max_blocked_users = 5;
  uint64 max_blocked_posts = 6;
  uint64 max_blocked_communities = 7;
  uint64 max_title_length = 8;
  uint64 max_content_length = 9;
  uint64 editing_time_mins = 10;
  reserved 11, 12;

  // double fields
  double vote_weight = 13;

  // bool fields
  reserved 15; // was can_be_agent
  bool can_remove_anon = 16;
  bool can_have_biography = 17;
  bool can_have_avatar = 18;
  bool can_have_banner = 19;
  bool can_have_flair = 20;
  // max_biography_length is the max biography length for this tier (0 = disabled)
  uint64 max_biography_length = 21;
  uint64 max_curation_memberships = 22;
  // max_daily_relays is the UTC-day envelope quota for this tier.
  // 0 means the account uses proof of work instead of the relay quota path.
  uint64 max_daily_relays = 23;
  reserved 24; // was can_award_free; free awards are hardcoded to level >= 100
}

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "mirage/x/core/Params";
  option (gogoproto.equal) = true;

  // min_difficulty defines the base PoW target: base_target = 2^(256 - min_difficulty).
  // The dynamic difficulty is stored on-chain as integer steps (0 = base).
  uint64 min_difficulty = 1;

  // pow_message_window is the sliding window size (in blocks) over which PoW message volume is measured
  uint64 pow_message_window = 2;

  // pow_message_limit: if >= this many PoW messages observed in the window, increase difficulty
  uint64 pow_message_limit = 3;

  // pow_calm_period_definition: if < this many PoW messages observed in the window, it's a calm period
  uint64 pow_calm_period_definition = 4;

  // pow_calm_sequence_threshold: number of consecutive calm periods before decreasing difficulty
  uint64 pow_calm_sequence_threshold = 5;

  // tag 6 reserved

  // mint_interval is the number of blocks between minting events
  uint64 mint_interval = 7;

  // mint_quantity is the number of umirage minted per mint event
  uint64 mint_quantity = 8;

  // block_hash_window is the number of recent committed block hashes to accept for PoW validation
  uint64 block_hash_window = 9;

  // pow_difficulty_allowance: number of blocks after a change where previous difficulty is accepted
  uint64 pow_difficulty_allowance = 10;

  // tags 11-33 reserved

  // max_username_size is the maximum username length
  uint64 max_username_size = 34;

  // max_community_size is the maximum community slug length
  uint64 max_community_size = 35;

  // min_username_size is the minimum username length
  uint64 min_username_size = 36;

  // min_community_size is the minimum community slug length
  uint64 min_community_size = 37;

  // mint_dynamic_credit_cap caps per-interval relay credits per validator.
  // Zero disables credit weighting; the dynamic pool then falls back to stake weighting.
  uint64 mint_dynamic_credit_cap = 38;

  // mint_dynamic_split is fraction [0,1] of MintQuantity allocated to dynamic pool
  double mint_dynamic_split = 39;

  // subscription_period is the renewal period in minutes; 0 = one-time payment, 43200 = 30 days
  uint64 subscription_period = 40;

  // tiers defines the tier configurations, indexed by user-level-to-tier mapping.
  // The exact level -> tier-index mapping is defined by LevelToTierIndex in
  // x/core/types/params.go: level 0 (Free) -> 0, level 1 (Subscriber) -> 1,
  // level >= 100 (Admin) -> 2. Levels 2-9 and 10 are invalid after v1.39.0.
  // Admin is appointed via governance (period_fee must be 0); it is not purchased.
  repeated TierConfig tiers = 41;

  // subscription_reserve_percent is superseded by subscription_reserve_bps and
  // MUST be 0. It is kept only so stored Params blobs written before v1.34.0
  // still decode; nothing reads it. Validate rejects a non-zero value rather
  // than letting a float re-enter the reserve/burn split (retest L-4).
  double subscription_reserve_percent = 42 [deprecated = true];

  // relay_min_gas_price is the minimum gas price for relay fee calculation (in umirage per gas unit)
  // Default: 1000 (1000 umirage per gas). Set to match node's minimum-gas-prices.
  uint64 relay_min_gas_price = 43;

  // relay_max_gas_fee is the maximum gas fee that can be deducted per relayed transaction (in umirage)
  // Default: 500,000,000 (500 MIRAGE). Protects users from unexpectedly high fees.
  uint64 relay_max_gas_fee = 44;

  // max_envelope_age is the maximum age in seconds for envelope_timestamp.
  // Transactions with envelope_timestamp older than (now - max_envelope_age) are rejected.
  // This provides replay protection by ensuring stale transactions cannot be resubmitted.
  // Default: 60 (reject transactions older than 60 seconds).
  uint64 max_envelope_age = 45;

  // tags 46-49 reserved
  reserved 46 to 49;

  // Were bridge_chains / bridge_attestation_threshold; removed in v1.31.0
  reserved 50, 51;

  // pow_difficulty_step is the fractional step for the exponential difficulty factor [0.01, 1.0]
  // Effective factor: 1000 * (1 + step)^difficulty. On busy: difficulty += 1. On calm: difficulty -= 1.
  // Default: 0.25 (25% per step)
  double pow_difficulty_step = 52;

  // award_configs defines available award types and their costs in umirage
  repeated AwardConfig award_configs = 53;

  // subscription_reserve_bps is the fraction of the period fee escrowed as gas
  // reserve, in basis points [0, 10000]. The remainder is burned, and reserve +
  // burn equals the fee exactly at every value. Integer because the float it
  // replaces could not represent every split without rounding drift.
  // Default: 9500 (95% reserved, 5% burned).
  uint64 subscription_reserve_bps = 54;

  // mint_floor_split is the fraction [0,1] of MintQuantity paid out equally to
  // every bonded validator, regardless of stake or traffic. It is what makes a
  // small node worth running at all. mint_floor_split + mint_dynamic_split must
  // not exceed 1; the remainder stays stake-weighted.
  // Zero is valid so Params blobs written before v1.38.0 still decode.
  // Default: 0.20 (20% floor).
  double mint_floor_split = 55;

  uint64 subscription_creator_bps = 56;
  uint64 max_curators_per_team = 57;
  uint64 max_pending_curator_invites_per_team = 58;
  uint64 max_pending_curator_invites_per_user = 59;
  reserved 60, 61; // were community title and description limits
  uint64 max_curation_team_name_length = 62;
  uint64 max_curation_team_description_length = 63;
  reserved 64; // was max_curation_team_policy_length
  uint64 subscription_transitions_per_block = 65;
  uint64 curation_prune_keys_per_block = 66;
  uint64 creator_epoch_closures_per_block = 67;
  uint64 creator_settlement_records_per_block = 68;
  uint64 creator_prune_keys_per_block = 69;
  uint64 creator_claim_window_days = 70;
  uint64 max_creator_claim_epochs = 71;
  uint64 max_creator_engagements_per_epoch = 72;
  uint64 creator_epoch_expiries_per_block = 73;
  uint64 subscription_early_renewal_days = 74;
  uint64 subscription_renewal_attempts_per_block = 75;
  // subscriber_daily_relay_limit must equal tiers[1].max_daily_relays.
  // Kept so existing governance proposals and APIs that name this field still
  // work; runtime quota reads tiers[level].max_daily_relays.
  uint64 subscriber_daily_relay_limit = 76;
  uint64 max_subscription_periods_per_purchase = 77;
}

// AwardConfig defines a single award type and its cost.
message AwardConfig {
  option (gogoproto.equal) = true;

  // name is the unique identifier for this award type (e.g., "quality_post")
  string name = 1;

  // cost is the amount of umirage burned when giving this award (0 for free awards)
  uint64 cost = 2;
}
