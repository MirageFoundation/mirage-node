syntax = "proto3";
package mirage.core.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "mirage/x/core/types";

// TierConfig defines the configuration for a membership tier.
message TierConfig {
  option (gogoproto.equal) = true;

  // uint64 fields
  uint64 period_fee = 1;             // umirage per period (0 for free tier)
  uint64 max_followed_mods = 2;      // 5, 10, 25, 50
  uint64 max_followed_users = 3;     // 25, 125, 500, 1000
  uint64 max_followed_topics = 4;    // 50, 250, 500, 1000
  uint64 max_blocked_users = 5;      // 10, 125, 500, 1000
  uint64 max_blocked_posts = 6;      // 25, 100, 200, 500
  uint64 max_quality_posts = 7;      // 0, 0, 50, 100
  uint64 max_title_length = 8;       // 130, 165, 200, 250
  uint64 max_content_length = 9;     // 1000, 2000, 5000, 25000
  uint64 editing_time_mins = 10;     // 10, 60, 360, 720
  uint64 archive_duration_days = 12; // 30, 90, 180, 365

  // double fields
  double vote_weight = 13;           // 1.0, 1.15, 1.30, 1.45

  // uint32 fields
  uint32 award_permissions = 14;     // 0-3 (0=none, higher=more award types)

  // bool fields
  bool eligible_for_mod = 15;        // false, false, true, true
  bool can_change_name = 16;         // false, true, true, true
  bool can_have_biography = 17;      // false, true, true, true
  bool can_have_avatar = 18;         // false, true, true, true
  bool can_have_banner = 19;         // false, true, true, true
}

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "mirage/x/core/Params";
  option (gogoproto.equal) = true;

  // min_difficulty is the absolute minimum difficulty level (never goes below this)
  uint64 min_difficulty = 1;

  // pow_message_window is the sliding window size (in blocks) over which PoW message volume is measured
  uint64 pow_message_window = 2;

  // pow_message_limit: if >= this many PoW messages observed in the window, increase difficulty
  uint64 pow_message_limit = 3;

  // pow_calm_period_definition: if < this many PoW messages observed in the window, it's a calm period
  uint64 pow_calm_period_definition = 4;

  // pow_calm_sequence_threshold: number of consecutive calm periods before decreasing difficulty
  uint64 pow_calm_sequence_threshold = 5;

  // mint_interval is the number of blocks between minting events
  uint64 mint_interval = 7;

  // mint_quantity is the number of umirage minted per mint event
  uint64 mint_quantity = 8;

  // block_hash_window is the number of recent committed block hashes to accept for PoW validation
  uint64 block_hash_window = 9;

  // pow_difficulty_allowance: number of blocks after a change where previous difficulty is accepted
  uint64 pow_difficulty_allowance = 10;

  // mint_dynamic_credit_cap caps per-interval relay credits per validator
  uint64 mint_dynamic_credit_cap = 38;

  // mint_dynamic_split is fraction [0,1] of MintQuantity allocated to dynamic pool
  double mint_dynamic_split = 39;

  // subscription_period is the renewal period in minutes; 0 = one-time payment, 43200 = 30 days
  uint64 subscription_period = 40;

  // tiers defines the tier configurations; index 0 = free, 1-3 = paid tiers
  repeated TierConfig tiers = 41;

  // min_username_size is the minimum username length
  uint64 min_username_size = 36;

  // max_username_size is the maximum username length
  uint64 max_username_size = 34;

  // max_topic_size is the maximum topic length
  uint64 max_topic_size = 35;

  // min_topic_size is the minimum topic length
  uint64 min_topic_size = 37;

  // subscription_reserve_percent is the percentage of period fee escrowed as gas reserve (0-100)
  // Default: 80 (80% of period fee goes to reserve, 20% burned)
  uint64 subscription_reserve_percent = 42;

  // relay_min_gas_price is the minimum gas price for relay fee calculation (in umirage per gas unit)
  // Default: 5000 (5000 umirage per gas). Set to match node's minimum-gas-prices.
  uint64 relay_min_gas_price = 43;

  // relay_max_gas_fee is the maximum gas fee that can be deducted per relayed transaction (in umirage)
  // Default: 500,000,000 (500 MIRAGE). Protects users from unexpectedly high fees.
  uint64 relay_max_gas_fee = 44;

  // max_envelope_age is the maximum age in seconds for envelope_timestamp.
  // Transactions with envelope_timestamp older than (now - max_envelope_age) are rejected.
  // This provides replay protection by ensuring stale transactions cannot be resubmitted.
  // Default: 60 (reject transactions older than 60 seconds).
  uint64 max_envelope_age = 45;

  // Bridge parameters (field numbers 50+)

  // bridge_chains defines the configuration for each supported bridge chain
  repeated BridgeChainConfig bridge_chains = 50;

  // bridge_attestation_threshold is the voting power threshold for minting (basis points)
  // Default: 6667 = 66.67% of total voting power required
  uint64 bridge_attestation_threshold = 51;

  // bridge_fee is the flat fee in umirage charged and burned for all bridge transfers
  // Default: 1000000 = 1 MIRAGE
  uint64 bridge_fee = 52;
}

// BridgeChainConfig defines the configuration for a bridgeable chain.
message BridgeChainConfig {
  option (gogoproto.equal) = true;

  // chain_id is the unique identifier for this chain (e.g., "solana", "ethereum", "osmosis")
  string chain_id = 1;

  // contract_address is the bridge contract/program address on the external chain
  // For IBC chains, this can be empty or contain the channel info
  string contract_address = 2;

  // enabled indicates whether bridging to/from this chain is currently allowed
  bool enabled = 3;

  // is_ibc indicates whether this chain uses IBC (true) or attested bridge (false)
  bool is_ibc = 4;

  // ibc_channel is the IBC channel ID for IBC-enabled chains (e.g., "channel-1")
  string ibc_channel = 5;
}
