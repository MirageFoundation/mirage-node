syntax = "proto3";

package mirage.core.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "mirage/core/v1/params.proto";

option go_package = "mirage/x/core/types";

// Query defines the gRPC querier service.
service Query {
  // GetParams queries the parameters of the module.
  rpc GetParams(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/mirage/core/v1/params";
  }

  // GetDifficulty queries the current PoW difficulty state.
  rpc GetDifficulty(QueryDifficultyRequest) returns (QueryDifficultyResponse) {
    option (google.api.http).get = "/mirage/core/v1/difficulty";
  }

  // GetProfile queries a profile by address.
  rpc GetProfile(QueryProfileRequest) returns (QueryProfileResponse) {
    option (google.api.http).get = "/mirage/core/v1/profile/{address}";
  }

  // GetProfiles queries all profiles with pagination.
  rpc GetProfiles(QueryProfilesRequest) returns (QueryProfilesResponse) {
    option (google.api.http).get = "/mirage/core/v1/profiles";
  }

  // GetBridgeStatus queries the current bridge status including enabled chains.
  rpc GetBridgeStatus(QueryBridgeStatusRequest) returns (QueryBridgeStatusResponse) {
    option (google.api.http).get = "/mirage/core/v1/bridge/status";
  }

  // GetBridgeAttestation queries a specific inbound attestation by source chain and burn_id.
  rpc GetBridgeAttestation(QueryBridgeAttestationRequest) returns (QueryBridgeAttestationResponse) {
    option (google.api.http).get = "/mirage/core/v1/bridge/attestation/{source_chain}/{burn_id}";
  }

  // GetBridgeConfig queries the bridge configuration parameters.
  rpc GetBridgeConfig(QueryBridgeConfigRequest) returns (QueryBridgeConfigResponse) {
    option (google.api.http).get = "/mirage/core/v1/bridge/config";
  }

  // GetBridgeMint queries a mint confirmation by destination_chain and burn_id (outbound bridge).
  rpc GetBridgeMint(QueryBridgeMintRequest) returns (QueryBridgeMintResponse) {
    option (google.api.http).get = "/mirage/core/v1/bridge/mint/{destination_chain}/{burn_id}";
  }

  // GetBridgeBurn queries a burn record by destination_chain and burn_id (outbound bridge).
  rpc GetBridgeBurn(QueryBridgeBurnRequest) returns (QueryBridgeBurnResponse) {
    option (google.api.http).get = "/mirage/core/v1/bridge/burn/{destination_chain}/{burn_id}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryDifficultyRequest is request type for the Query/Difficulty RPC method.
message QueryDifficultyRequest {}

// QueryDifficultyResponse is response type for the Query/Difficulty RPC method.
message QueryDifficultyResponse {
  // current_difficulty is the current PoW difficulty step (0 = base, 1 = +step, 2 = +step^2, ...)
  uint64 current_difficulty = 1;
  // previous_difficulty is the difficulty step before the last change
  uint64 previous_difficulty = 2;
  // last_change_height is the block height when difficulty last changed
  int64 last_change_height = 3;
  // pow_message_count is the number of PoW messages in the current window
  uint64 pow_message_count = 4;
  // consecutive_low_usage is the count of consecutive calm periods
  uint64 consecutive_low_usage = 5;
  // latest_block_hash is the most recent committed block hash (hex, lowercase)
  string latest_block_hash = 6;
  // current_height is the current block height
  int64 current_height = 7;
  // min_difficulty is the base difficulty (leading zero bits) used to compute the PoW target
  uint64 min_difficulty = 8;
}

// QueryProfileRequest is the request type for the Query/Profile RPC method.
message QueryProfileRequest {
  string address = 1;
}

// QueryProfileResponse is the response type for the Query/Profile RPC method.
message QueryProfileResponse {
  string owner = 1;
  string username = 2;
  int32 level = 3;
  int64 created_at = 4;
  int64 subscription_expiry = 5;
  bool auto_renew = 6;
  uint64 reserve_funds = 7;
  bool is_moderator = 8;
  string biography = 9;
  string avatar = 10;
  string banner = 11;
  
  // Lists (stored separately but returned together for convenience)
  repeated string followed_moderators = 12;
  repeated string followed_users = 13;
  repeated string followed_topics = 14;
  repeated string blocked_users = 15;
  repeated string blocked_posts = 16;
  repeated string quality_posts = 17;
}

// QueryProfilesRequest is the request type for the Query/Profiles RPC method.
message QueryProfilesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryProfilesResponse is the response type for the Query/Profiles RPC method.
message QueryProfilesResponse {
  repeated QueryProfileResponse profiles = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryBridgeStatusRequest is the request type for the Query/BridgeStatus RPC method.
message QueryBridgeStatusRequest {}

// BridgeChainStatus contains per-chain bridge state
message BridgeChainStatus {
  // chain_id is the chain identifier (e.g., "solana")
  string chain_id = 1;
  // current_sequence is the latest burn sequence for outbound transfers
  uint64 current_sequence = 2;
}

// QueryBridgeStatusResponse is the response type for the Query/BridgeStatus RPC method.
message QueryBridgeStatusResponse {
  // enabled_chains lists all chains with bridging currently enabled
  repeated BridgeChainConfig enabled_chains = 1;
  // pending_attestations_count is the number of attestations awaiting threshold
  uint64 pending_attestations_count = 2;
  // chain_status contains per-chain sequence counters for outbound burns
  repeated BridgeChainStatus chain_status = 3;
}

// QueryBridgeAttestationRequest is the request type for the Query/BridgeAttestation RPC method.
// Queries inbound bridge attestations (external chain -> Mirage).
message QueryBridgeAttestationRequest {
  // source_chain is the external chain where the burn occurred (e.g., "solana")
  string source_chain = 1;
  // burn_id is the unique identifier of the burn on the external chain (tx hash)
  string burn_id = 2;
}

// QueryBridgeAttestationResponse is the response type for the Query/BridgeAttestation RPC method.
message QueryBridgeAttestationResponse {
  // found indicates whether the attestation exists
  bool found = 1;
  // source_chain is the external chain where the burn occurred
  string source_chain = 2;
  // burn_id is the unique identifier of the burn
  string burn_id = 3;
  // mirage_recipient is the destination address on Mirage chain
  string mirage_recipient = 4;
  // amount is the amount to be minted (in umirage)
  uint64 amount = 5;
  // attestors lists the validator addresses that have attested
  repeated string attestors = 6;
  // attested_power is the total voting power that has attested
  int64 attested_power = 7;
  // required_power is the voting power required to mint
  int64 required_power = 8;
  // minted indicates whether tokens have been minted
  bool minted = 9;
  // created_at is the block height when attestation was first created
  int64 created_at = 10;
}

// QueryBridgeConfigRequest is the request type for the Query/BridgeConfig RPC method.
message QueryBridgeConfigRequest {}

// QueryBridgeConfigResponse is the response type for the Query/BridgeConfig RPC method.
message QueryBridgeConfigResponse {
  // chains lists all configured bridge chains (each has its own fee)
  repeated BridgeChainConfig chains = 1;
  // attestation_threshold is the voting power fraction required for minting [0.0, 1.0]
  double attestation_threshold = 2;
}

// QueryBridgeMintRequest is the request type for the Query/BridgeMint RPC method.
// Queries outbound bridge mint confirmations (Mirage -> external chain).
message QueryBridgeMintRequest {
  // destination_chain is the external chain where mint should occur (e.g., "solana")
  string destination_chain = 1;
  // burn_id is the Mirage burn sequence number
  string burn_id = 2;
}

// QueryBridgeMintResponse is the response type for the Query/BridgeMint RPC method.
message QueryBridgeMintResponse {
  // minted indicates whether the mint has been confirmed (threshold crossed)
  bool minted = 1;
  // destination_chain is the external chain where mint occurred (e.g., "solana")
  string destination_chain = 2;
  // destination_tx is the tx signature/hash on the destination chain
  string destination_tx = 3;
  // found indicates whether any attestation record exists for this burn
  bool found = 4;
  // attestors lists the validator addresses that have attested
  repeated string attestors = 5;
  // attested_power is the total voting power that has attested
  int64 attested_power = 6;
  // required_power is the voting power required to confirm
  int64 required_power = 7;
}

// QueryBridgeBurnRequest is the request type for the Query/BridgeBurn RPC method.
// Queries outbound bridge burn records (Mirage -> external chain).
message QueryBridgeBurnRequest {
  // destination_chain is the external chain (e.g., "solana")
  string destination_chain = 1;
  // burn_id is the Mirage burn sequence number
  string burn_id = 2;
}

// QueryBridgeBurnResponse is the response type for the Query/BridgeBurn RPC method.
message QueryBridgeBurnResponse {
  // found indicates whether the burn record exists
  bool found = 1;
  // burn_id is the Mirage burn sequence number
  string burn_id = 2;
  // owner is the Mirage address that initiated the burn
  string owner = 3;
  // destination_chain is the external chain (e.g., "solana")
  string destination_chain = 4;
  // destination_address is the recipient address on the destination chain
  string destination_address = 5;
  // amount is the gross amount burned (in umirage)
  uint64 amount = 6;
  // bridge_fee is the fee deducted from the amount (in umirage)
  uint64 bridge_fee = 7;
  // sequence is the outbound bridge sequence for the destination chain
  uint64 sequence = 8;
  // created_at is the block height when the burn occurred
  int64 created_at = 9;
}
