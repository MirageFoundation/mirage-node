syntax = "proto3";

package mirage.core.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "mirage/core/v1/params.proto";
import "mirage/core/v1/community.proto";

option go_package = "mirage/x/core/types";

// Query defines the gRPC querier service.
service Query {
  // GetParams queries the parameters of the module.
  rpc GetParams(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/mirage/core/v1/params";
  }

  // GetDifficulty queries the current PoW difficulty state.
  rpc GetDifficulty(QueryDifficultyRequest) returns (QueryDifficultyResponse) {
    option (google.api.http).get = "/mirage/core/v1/difficulty";
  }

  // GetProfile queries a profile by address.
  rpc GetProfile(QueryProfileRequest) returns (QueryProfileResponse) {
    option (google.api.http).get = "/mirage/core/v1/profile/{address}";
  }

  // GetProfiles queries all profiles with pagination.
  rpc GetProfiles(QueryProfilesRequest) returns (QueryProfilesResponse) {
    option (google.api.http).get = "/mirage/core/v1/profiles";
  }

  rpc CurationTeam(QueryCurationTeamRequest) returns (QueryCurationTeamResponse) {
    option (google.api.http).get = "/mirage/core/v1/community/{community}/team/{team_id}";
  }
  rpc CurationTeams(QueryCurationTeamsRequest) returns (QueryCurationTeamsResponse) {
    option (google.api.http).get = "/mirage/core/v1/community/{community}/teams";
  }
  rpc AllCurationTeams(QueryAllCurationTeamsRequest) returns (QueryAllCurationTeamsResponse) {
    option (google.api.http).get = "/mirage/core/v1/curation/teams";
  }
  rpc CurationTeamMembers(QueryCurationTeamMembersRequest) returns (QueryCurationTeamMembersResponse) {
    option (google.api.http).get = "/mirage/core/v1/community/{community}/team/{team_id}/members";
  }
  rpc PendingCuratorInvitations(QueryPendingCuratorInvitationsRequest) returns (QueryPendingCuratorInvitationsResponse) {
    option (google.api.http).get = "/mirage/core/v1/curation/invitations/{address}";
  }
  rpc CurationMemberships(QueryCurationMembershipsRequest) returns (QueryCurationMembershipsResponse) {
    option (google.api.http).get = "/mirage/core/v1/curation/memberships/{address}";
  }
  rpc CommunityPreference(QueryCommunityPreferenceRequest) returns (QueryCommunityPreferenceResponse) {
    option (google.api.http).get = "/mirage/core/v1/community/{community}/preference/{owner}";
  }
  rpc PostMetadata(QueryPostMetadataRequest) returns (QueryPostMetadataResponse) {
    option (google.api.http).get = "/mirage/core/v1/post/{txhash}";
  }
  rpc CreatorEpoch(QueryCreatorEpochRequest) returns (QueryCreatorEpochResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/epoch/{epoch_id}";
  }
  rpc CreatorAccruals(QueryCreatorAccrualsRequest) returns (QueryCreatorAccrualsResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/accruals/{creator}";
  }
  rpc CreatorEpochAccruals(QueryCreatorEpochAccrualsRequest) returns (QueryCreatorEpochAccrualsResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/epoch/{epoch_id}/accruals";
  }
  rpc TargetEarnings(QueryTargetEarningsRequest) returns (QueryTargetEarningsResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/target/{target}";
  }
  rpc CreatorEpochTargets(QueryCreatorEpochTargetsRequest) returns (QueryCreatorEpochTargetsResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/epoch/{epoch_id}/targets";
  }
  rpc SubscriptionTranches(QuerySubscriptionTranchesRequest) returns (QuerySubscriptionTranchesResponse) {
    option (google.api.http).get = "/mirage/core/v1/subscription/tranches/{address}";
  }
  rpc SubscriptionRenewal(QuerySubscriptionRenewalRequest) returns (QuerySubscriptionRenewalResponse) {
    option (google.api.http).get = "/mirage/core/v1/subscription/renewal/{address}";
  }
  rpc SubscriberQuota(QuerySubscriberQuotaRequest) returns (QuerySubscriberQuotaResponse) {
    option (google.api.http).get = "/mirage/core/v1/subscription/quota/{address}";
  }
  rpc CreatorLiability(QueryCreatorLiabilityRequest) returns (QueryCreatorLiabilityResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/liability";
  }
  rpc CreatorSchedule(QueryCreatorScheduleRequest) returns (QueryCreatorScheduleResponse) {
    option (google.api.http).get = "/mirage/core/v1/creator/schedule";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryDifficultyRequest is request type for the Query/Difficulty RPC method.
message QueryDifficultyRequest {}

// QueryDifficultyResponse is response type for the Query/Difficulty RPC method.
message QueryDifficultyResponse {
  // current_difficulty is the current PoW difficulty step (0 = base, 1 = +step, 2 = +step^2, ...)
  uint64 current_difficulty = 1;
  // previous_difficulty is the difficulty step before the last change
  uint64 previous_difficulty = 2;
  // last_change_height is the block height when difficulty last changed
  int64 last_change_height = 3;
  // pow_message_count is the number of PoW messages in the current window
  uint64 pow_message_count = 4;
  // consecutive_low_usage is the count of consecutive calm periods
  uint64 consecutive_low_usage = 5;
  // latest_block_hash is the most recent committed block hash (hex, lowercase)
  string latest_block_hash = 6;
  // current_height is the current block height
  int64 current_height = 7;
  // min_difficulty is the base difficulty (leading zero bits) used to compute the PoW target
  uint64 min_difficulty = 8;
}

// QueryProfileRequest is the request type for the Query/Profile RPC method.
message QueryProfileRequest {
  string address = 1;
}

// QueryProfileResponse is the response type for the Query/Profile RPC method.
message QueryProfileResponse {
  string owner = 1;
  string username = 2;
  int32 level = 3;
  int64 created_at = 4;
  int64 subscription_expiry = 5;
  bool auto_renew = 6;
  uint64 reserve_funds = 7;
  reserved 8;
  string biography = 9;
  string avatar = 10;
  string banner = 11;
  string flair = 18;
  bool effective_paid = 19;

  // Lists (stored separately but returned together for convenience)
  reserved 12; // was enabled_agents
  repeated string followed_users = 13;
  repeated string joined_communities = 14;
  repeated string blocked_users = 15;
  repeated string blocked_posts = 16;
  repeated string blocked_communities = 17;
}

// QueryProfilesRequest is the request type for the Query/Profiles RPC method.
message QueryProfilesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryProfilesResponse is the response type for the Query/Profiles RPC method.
message QueryProfilesResponse {
  repeated QueryProfileResponse profiles = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCurationTeamRequest {
  string community = 1;
  uint64 team_id = 2;
}
message QueryCurationTeamResponse { CurationTeam team = 1; }

message QueryCurationTeamsRequest {
  string community = 1;
  bool include_deleted = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryCurationTeamsResponse {
  repeated CurationTeam teams = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAllCurationTeamsRequest {
  bool include_deleted = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryAllCurationTeamsResponse {
  repeated CurationTeam teams = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCurationTeamMembersRequest {
  string community = 1;
  uint64 team_id = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryCurationTeamMembersResponse {
  repeated CurationTeamMember members = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPendingCuratorInvitationsRequest {
  string address = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message PendingCuratorInvitation {
  string community = 1;
  uint64 team_id = 2;
  string invitee = 3;
  string inviter = 4;
}
message QueryPendingCuratorInvitationsResponse {
  repeated PendingCuratorInvitation invitations = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCurationMembershipsRequest {
  string address = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message CurationMembership {
  string community = 1;
  uint64 team_id = 2;
}
message QueryCurationMembershipsResponse {
  repeated CurationMembership memberships = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCommunityPreferenceRequest {
  string owner = 1;
  string community = 2;
}
message QueryCommunityPreferenceResponse {
  CommunityPreference stored = 1;
  CurationPreferenceMode effective_mode = 2;
  uint64 effective_team_id = 3;
}

message QueryPostMetadataRequest { string txhash = 1; }
message QueryPostMetadataResponse { PostMetadata metadata = 1; }

message QueryCreatorEpochRequest { int64 epoch_id = 1; }
message QueryCreatorEpochResponse { CreatorEpoch epoch = 1; }

message QueryCreatorAccrualsRequest {
  string creator = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryCreatorAccrualsResponse {
  repeated CreatorAccrual accruals = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCreatorEpochAccrualsRequest {
  int64 epoch_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryCreatorEpochAccrualsResponse {
  repeated CreatorAccrual accruals = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTargetEarningsRequest {
  string target = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message TargetEarning {
  int64 epoch_id = 1;
  string target = 2;
  string creator = 3;
  uint64 upvote_units = 4;
  uint64 direct_reply_units = 5;
  string amount = 6;
}
message QueryTargetEarningsResponse {
  repeated TargetEarning earnings = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// CreatorEpochTargets lists every post that earned in one epoch. TargetEarnings
// answers "what did this post earn", which cannot build a creator's breakdown
// without one query per post.
message QueryCreatorEpochTargetsRequest {
  int64 epoch_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryCreatorEpochTargetsResponse {
  repeated TargetEarning earnings = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySubscriptionTranchesRequest {
  string address = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QuerySubscriptionTranchesResponse {
  repeated SubscriptionTranche tranches = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySubscriptionRenewalRequest { string address = 1; }
message QuerySubscriptionRenewalResponse {
  SubscriptionRenewalState state = 1;
  uint32 curation_membership_count = 2;
}

message QuerySubscriberQuotaRequest { string address = 1; }
message QuerySubscriberQuotaResponse {
  int64 epoch = 1;
  uint64 limit = 2;
  uint64 used = 3;
  uint64 remaining = 4;
  int64 reset_at = 5;
}

message QueryCreatorLiabilityRequest {}
message QueryCreatorLiabilityResponse {
  string liability = 1;
  string module_balance = 2;
  string activation_surplus = 3;
}

message QueryCreatorScheduleRequest {}
message QueryCreatorScheduleResponse {
  int64 origin_epoch = 1;
  int64 origin_unix = 2;
  uint64 epoch_seconds = 3;
  int64 current_epoch = 4;
}

