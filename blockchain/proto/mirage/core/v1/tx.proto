syntax = "proto3";

package mirage.core.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "mirage/core/v1/params.proto";

option go_package = "mirage/x/core/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // Post creates a post.
  rpc Post(MsgPost) returns (MsgPostResponse);

  // Edit updates an existing post or comment (override refers to txhash being edited).
  rpc Edit(MsgEdit) returns (MsgEditResponse);

  // Vote creates a vote.
  rpc Vote(MsgVote) returns (MsgVoteResponse);

  // SetUsername persists a username for the signer.
  rpc SetUsername(MsgSetUsername) returns (MsgSetUsernameResponse);

  // FollowModerator adds a moderator to the signer's followed list (capped deque).
  rpc FollowModerator(MsgFollowModerator) returns (MsgFollowModeratorResponse);

  // UnfollowModerator removes a moderator from the signer's followed list.
  rpc UnfollowModerator(MsgUnfollowModerator) returns (MsgUnfollowModeratorResponse);

  // FollowUser adds a user to the signer's followed users list (capped deque).
  rpc FollowUser(MsgFollowUser) returns (MsgFollowUserResponse);

  // UnfollowUser removes a user from the signer's followed users list.
  rpc UnfollowUser(MsgUnfollowUser) returns (MsgUnfollowUserResponse);

  // FollowTopic adds a topic to the signer's followed topics list (capped deque).
  rpc FollowTopic(MsgFollowTopic) returns (MsgFollowTopicResponse);

  // UnfollowTopic removes a topic from the signer's followed topics list.
  rpc UnfollowTopic(MsgUnfollowTopic) returns (MsgUnfollowTopicResponse);

  // BlockPost blocks a post txhash (persisted on-chain).
  rpc BlockPost(MsgBlockPost) returns (MsgBlockPostResponse);

  // UnblockPost unblocks a post txhash (persisted on-chain).
  rpc UnblockPost(MsgUnblockPost) returns (MsgUnblockPostResponse);

  // BlockUser blocks a user address (persisted on-chain).
  rpc BlockUser(MsgBlockUser) returns (MsgBlockUserResponse);

  // UnblockUser unblocks a user address (persisted on-chain).
  rpc UnblockUser(MsgUnblockUser) returns (MsgUnblockUserResponse);

  // Delete marks a post or comment as deleted (only emits event for indexer).
  rpc Delete(MsgDelete) returns (MsgDeleteResponse);

  // SendTokens sends tokens from signer to target.
  rpc SendTokens(MsgSendTokens) returns (MsgSendTokensResponse);

  // SetLevel sets the user level for an address (governance only).
  rpc SetLevel(MsgSetLevel) returns (MsgSetLevelResponse);

  // PunishValidator slashes/jails/tombstones a validator (governance only).
  rpc PunishValidator(MsgPunishValidator) returns (MsgPunishValidatorResponse);

  // MintTo mints new tokens to a recipient address (governance only).
  rpc MintTo(MsgMintTo) returns (MsgMintToResponse);

  // UpgradeLevel upgrades user tier (requires token payment, no PoW).
  rpc UpgradeLevel(MsgUpgradeLevel) returns (MsgUpgradeLevelResponse);

  // SetAutoRenewal sets the auto_renew flag for a user's subscription.
  // Paid subscribers must pay via reserve; PoW is not allowed.
  rpc SetAutoRenewal(MsgSetAutoRenewal) returns (MsgSetAutoRenewalResponse);

  // IBCTransfer initiates an IBC transfer to another chain (e.g., Osmosis).
  // Uses envelope fields for relay signature verification.
  rpc IBCTransfer(MsgIBCTransfer) returns (MsgIBCTransferResponse);

  // BridgeBurn burns MIRAGE tokens for bridging to an external chain (e.g., Solana).
  // Uses envelope fields for relay signature verification.
  rpc BridgeBurn(MsgBridgeBurn) returns (MsgBridgeBurnResponse);

  // BridgeAttest allows validators to attest to a burn on an external chain.
  // Does NOT use envelope - signed directly by validator's consensus key.
  rpc BridgeAttest(MsgBridgeAttest) returns (MsgBridgeAttestResponse);

  // BridgeMinted allows validators to report successful mint on a destination chain.
  // Signed by validator's operator key.
  rpc BridgeMinted(MsgBridgeMinted) returns (MsgBridgeMintedResponse);

}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "mirage/x/core/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgPost creates a post or comment
message MsgPost {
  option (cosmos.msg.v1.signer) = "authority";
  
  // REQUIRED: address of the signer (node or governance)
  string authority = 1;
  
  // Envelope fields for msg relaying (not required for gov proposals)
  bytes envelope_pubkey = 2;
  bytes envelope_block_hash = 3;
  uint64 envelope_difficulty = 4;
  uint64 envelope_pow = 5;
  uint64 envelope_timestamp = 6;
  // tags 7-9 reserved
  bytes envelope_signature = 10;
  
  // Payload
  string target = 100;
  string topic = 101;
  string title = 102;
  string content = 103;
  string tag = 104;
}

message MsgPostResponse {}

