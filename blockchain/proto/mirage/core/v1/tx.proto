  bytes envelope_block_hash = 3;
  uint64 envelope_difficulty = 4;
  uint64 envelope_pow = 5;
  uint64 envelope_timestamp = 6;
  uint64 envelope_nonce = 7;
  // tags 8-9 reserved
  bytes envelope_signature = 10;

  // Payload
  string target = 100;
  string award_type = 101;
}

message MsgAwardResponse {}

// MsgSetBiography sets a biography for an address (subscriber-only feature)
message MsgSetBiography {
  option (cosmos.msg.v1.signer) = "authority";

  // REQUIRED: address of the signer (node or governance)
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Envelope fields for msg relaying (not required for gov proposals)
  bytes envelope_pubkey = 2;
  bytes envelope_block_hash = 3;
  uint64 envelope_difficulty = 4;
  uint64 envelope_pow = 5;
  uint64 envelope_timestamp = 6;
  uint64 envelope_nonce = 7;
  // tags 8-9 reserved
  bytes envelope_signature = 10;

  // Payload
  string target = 100;
  string biography = 101;
}

message MsgSetBiographyResponse {}

// MsgAnnotate creates an agent overlay on an existing post (agent-tier only).
// "." means no change; empty string means clear. No target field (cannot re-parent).
message MsgAnnotate {
  option (cosmos.msg.v1.signer) = "authority";

  // REQUIRED: address of the signer (node or governance)
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Envelope fields for msg relaying (not required for gov proposals)
  bytes envelope_pubkey = 2;
  bytes envelope_block_hash = 3;
  uint64 envelope_difficulty = 4;
  uint64 envelope_pow = 5;
  uint64 envelope_timestamp = 6;
  uint64 envelope_nonce = 7;
  // tags 8-9 reserved
  bytes envelope_signature = 10;

  // Payload (no target — agents cannot re-parent posts)
  string topic = 101;
  string title = 102;
  string content = 103;
  string tag = 104;
  string override = 105;
  repeated string media = 106;
  string appendix = 107;
}

message MsgAnnotateResponse {}

