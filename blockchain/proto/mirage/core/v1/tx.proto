// MsgPunishValidator slashes/jails/tombstones a validator (governance only)
message MsgPunishValidator {
  option (cosmos.msg.v1.signer) = "authority";

  // REQUIRED: address of the signer (must be gov module account)
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // valoper is the validator operator address to punish
  string valoper = 2;

  // fraction is the slash fraction as a decimal string (e.g., "0.01" for 1%)
  string fraction = 3;

  // jail if true, jail the validator
  bool jail = 4;

  // tombstone if true, tombstone the validator (permanent)
  bool tombstone = 5;

  // reason is an optional explanation for the punishment
  string reason = 6;
}

message MsgPunishValidatorResponse {}

