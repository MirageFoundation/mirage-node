  uint64 envelope_timestamp = 6;
  // tags 7-9 reserved
  bytes envelope_signature = 10;

  // Payload
  string destination_chain = 100;
  string destination_address = 101;
  uint64 amount = 102;
}

message MsgBridgeBurnResponse {
  uint64 burn_id = 1;
}

// MsgBridgeAttestBurned allows validators to attest to a burn on an external chain (inbound).
// When attestations reach 2/3 validator threshold, tokens are minted on Mirage.
// NOTE: This message does NOT use envelope fields - it's signed directly by validator.
message MsgBridgeAttestBurned {
  option (cosmos.msg.v1.signer) = "validator";

  // validator is the validator operator address submitting the attestation
  string validator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // source_chain is the external chain where the burn occurred (e.g., "solana")
  string source_chain = 2;

  // burn_id is the unique identifier of the burn on the external chain (tx hash)
  string burn_id = 3;

  // mirage_recipient is the destination address on Mirage chain
  string mirage_recipient = 4;

  // amount is the amount burned on the external chain (in umirage equivalent)
  uint64 amount = 5;
}

message MsgBridgeAttestBurnedResponse {
  bool confirmed = 1;
  int64 attested_power = 2;
  int64 required_power = 3;
}

// MsgBridgeAttestMinted allows validators to attest to a mint on an external chain (outbound).
// When attestations reach 2/3 validator threshold, BridgeConfirmed event is emitted.
message MsgBridgeAttestMinted {
  option (cosmos.msg.v1.signer) = "validator";

  // validator is the validator operator address submitting the attestation
  string validator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // burn_id is the Mirage burn sequence number (as string for consistency)
  string burn_id = 2;

  // destination_chain is the external chain identifier (e.g., "solana")
  string destination_chain = 3;

  // destination_tx is the tx signature/hash on the destination chain
  string destination_tx = 4;

  // mirage_tx_hash is the original Mirage burn tx hash (for indexing/linking)
  string mirage_tx_hash = 5;
}

message MsgBridgeAttestMintedResponse {
  bool confirmed = 1;
  int64 attested_power = 2;
  int64 required_power = 3;
}
