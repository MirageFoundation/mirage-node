// MsgPunishValidator defines a governance message to punish a validator.
message MsgPunishValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "mirage/x/core/MsgPunishValidator";

  // authority must be x/gov module address
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // valoper is the target validator operator address
  string valoper = 2;

  // fraction is the slashing fraction in [0,1] as decimal string (e.g., "0.25", "1.0")
  string fraction = 3;

  // jail, if true, jails the validator
  bool jail = 4;

  // tombstone, if true, tombstones the validator (irreversible)
  bool tombstone = 5;

  // reason is a free-form string recorded in events
  string reason = 6;
}

message MsgPunishValidatorResponse {}

// MsgMintTo defines a governance message to mint new tokens to a recipient.
message MsgMintTo {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "mirage/x/core/MsgMintTo";

  // authority must be x/gov module address
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // recipient account address (mirage1...); account will be auto-created on receive
  string recipient = 2;

  // amount to mint in base denom (umirage)
  uint64 amount = 3;

  // optional reason recorded in events
  string reason = 4;
}

message MsgMintToResponse {}

