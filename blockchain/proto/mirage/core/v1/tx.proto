  bytes envelope_pubkey = 2;
  bytes envelope_block_hash = 3;
  uint64 envelope_difficulty = 4;
  uint64 envelope_pow = 5;
  uint64 envelope_timestamp = 6;
  uint64 envelope_nonce = 7;
  // tags 8-9 reserved
  bytes envelope_signature = 10;

  // Payload (no target — agents cannot re-parent posts)
  string topic = 101;
  string title = 102;
  string content = 103;
  string tag = 104;
  string override = 105;
  repeated string media = 106;
  string appendix = 107;
}

message MsgAnnotateResponse {}
