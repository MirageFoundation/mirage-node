<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="refresh" content="30" />
    <title>Mirage - Upgrade in Progress</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1A1A1A;
                color: #FFFFFF;
            }

            .container {
                border-color: #333;
            }

            .subtitle {
                color: #999;
            }

            .timer {
                color: #777;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #FFFFFF;
                color: #111827;
            }

            .container {
                border-color: #e5e7eb;
            }

            .subtitle {
                color: #6b7280;
            }

            .timer {
                color: #9ca3af;
            }
        }

        .container {
            text-align: center;
            max-width: 480px;
            padding: 3rem 2rem;
            border: 1px solid;
            border-radius: 12px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
            opacity: 0.4;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .timer {
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">Mirage</div>
        <div class="spinner"></div>
        <h1>Upgrade in Progress</h1>
        <p class="subtitle">
            We're rolling out an update. This usually takes a few minutes.
            <br />Please check back shortly.
        </p>
        <p class="timer">This page reloads itself as soon as the update is finished.</p>
    </div>

    <script>
        // The meta refresh above is only a no-JS backstop: it does not fire while
        // the tab is frozen or backgrounded, and the CDN rewrites this response's
        // "no-store" to "no-cache", so a browser is free to keep the page and
        // re-show it from history long after the upgrade finished. Poll the same
        // readiness endpoint the entrypoint uses, and re-check the moment the user
        // comes back to the tab.
        (function () {
            var inFlight = false;

            function check() {
                if (inFlight) return;
                inFlight = true;
                fetch('/api/get_node_config?probe=' + Date.now(), { cache: 'no-store' }).then(
                    function (res) {
                        inFlight = false;
                        if (res.ok) location.reload();
                    },
                    function () {
                        inFlight = false;
                    }
                );
            }

            setInterval(check, 5000);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) check();
            });
            window.addEventListener('pageshow', check);
            check();
        })();
    </script>
</body>

</html>
