; Mirage in-container process manager. Rendered to /etc/supervisor/supervisord.conf.
; Programs live in /etc/supervisor/conf.d/ and inherit the entrypoint environment.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/root/.mirage/logs/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=7
pidfile=/var/run/supervisord.pid
childlogdir=/root/.mirage/logs/supervisor
identifier=mirage
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
