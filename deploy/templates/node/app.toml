# This is a TOML config file.
# For more information, see https://github.com/toml-lang/toml

###############################################################################
###                           Base Configuration                            ###
###############################################################################

# The minimum gas prices a validator is willing to accept for processing a
# transaction. A transaction's fees must meet the minimum of any denomination
# specified in this config (e.g. 0.25token1,0.0001token2).
minimum-gas-prices = "1000umirage"

# The maximum gas a query coming over rest/grpc may consume.
# If this is set to zero, the query can consume an unbounded amount of gas.
query-gas-limit = "0"

# default: the last 362880 states are kept, pruning at 10 block intervals
# nothing: all historic states will be saved, nothing will be deleted (i.e. archiving node)
# everything: 2 latest states will be kept; pruning at 10 block intervals.
# custom: allow pruning options to be manually specified through 'pruning-keep-recent', and 'pruning-interval'
pruning = "custom"
pruning-keep-recent = "${PRUNING_KEEP_RECENT}"
pruning-interval = "${PRUNING_INTERVAL}"

# Minimum number of blocks to retain in blockstore (for historical RPC queries)
# This keeps recent blocks/commits/txs so /block, /commit and tx lookups work.
min-retain-blocks = ${RETENTION_BLOCKS}

# Application database backend (goleveldb or pebbledb)
app-db-backend = "${APP_DB_BACKEND:-goleveldb}"

# IAVL fast-node index is DISABLED on the consensus read path. Serving a
# fast-node hit as authoritative is the advisory-as-authoritative trap that
# produced the mirage.talk app-hash divergences (2026-05-25 h4854225,
# 2026-06-12 h5280036): under concurrent query load the fast index can return a
# value one commit stale relative to the canonical IAVL tree. Disabling it
# forces every read through the canonical tree, which always re-executes
# deterministically. See docs/troubleshooting/divergence-recovery.md.
iavl-disable-fastnode = true

# inter-block-cache is left at the SDK default (enabled). The Commit<->Query
# state race that drove the mirage.talk divergences is fixed upstream in SDK
# v0.54 store/v2 (#24655: atomic lastCommitInfo + state-manager serialization),
# so the cache no longer needs to be disabled as a mitigation.

[api]
enable = true
enabled-unsafe-cors = true
address = "tcp://0.0.0.0:1317"

[grpc]
enable = true
address = "0.0.0.0:9090"

[rosetta]
enable = false

[telemetry]
enabled = false

[state-sync]
snapshot-interval = ${SNAPSHOT_INTERVAL}
snapshot-keep-recent = ${SNAPSHOT_KEEP_RECENT}

[mempool]
max-txs = 5000

[logging]
format = "plain"
level = "info"

