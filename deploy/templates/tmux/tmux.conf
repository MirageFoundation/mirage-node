##### Prefix on backtick
unbind C-b
set -g prefix \`
bind \` send-prefix

##### Terminal and keys
set -g default-terminal "xterm-256color"
set -g history-limit 100000
set -g mode-keys vi
set -g xterm-keys on

##### Keep window names stable (set by -n flag, not auto-renamed to running process)
set -g automatic-rename off
set -g allow-rename off

##### Splits with prefix + ] and prefix + =
# Side-by-side split
bind ] split-window -h -c "#{pane_current_path}"
# Stacked split
bind = split-window -v -c "#{pane_current_path}"

##### Copy mode with system clipboard (xclip not available in container, use tmux buffer)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##### Pane focus with prefix + arrows
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

##### Home and End behavior
bind -n Home send-keys C-a
bind -n End  send-keys C-e
bind -T copy-mode-vi Home send-keys -X start-of-line
bind -T copy-mode-vi End  send-keys -X end-of-line

##### Clean up default split bindings and q behavior
unbind '"'
unbind %
unbind q
bind q copy-mode

##### Mouse
set -g mouse on
bind Enter resize-pane -Z

##### Reload tmux config
bind r source-file /etc/tmux.conf \; display-message "Config reloaded..."

##### Dark mode defaults, inherit terminal theme
set -g @dark-background "default"
set -g @dark-foreground "default"
set -g @dark-pane-border "default"
set -g @dark-active-pane-border "default"
set -g @dark-status-bg "default"
set -g @dark-status-fg "default"

set -g status-bg "default"
set -g status-fg "default"
setw -g window-style "default"
setw -g window-active-style "default"

##### Scrolling and resize behavior
setw -g aggressive-resize on

##### Window and session helpers
unbind C-n
bind -n C-n new-window
unbind C-PageUp
unbind C-PageDown
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n F12 detach

