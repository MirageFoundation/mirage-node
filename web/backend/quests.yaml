# Mirage Quest and Achievement Definitions
#
# Reward type definitions:
# - type: "mirage" - MIRAGE tokens (amount in MIRAGE, not umirage)
# - type: "invite_code" - Invite code (amount = number of codes)
#
# Quest parameters:
# - action_type: The type of action that progresses this quest
# - target_count: Number of actions needed to complete
# - time_spacing_minutes: Minimum minutes between counted actions
# - min_content_length: Minimum character count for posts/comments
# - unique_target: Require unique targets (no voting same post twice)
# - unique_topics_min: Minimum number of unique topics for votes/comments
# - allow_self: Whether self-interactions count (default: true)
# - count_vote_changes: Whether changing a vote counts (default: false)
# - quality_threshold: Minimum upvotes/score required
# - unique_root_post: Comments must be on distinct root posts

daily_quests:
  # --- Comment quests (primary focus) ---
  - id: quick_commenter
    title: "Quick Commenter"
    description: "Leave 2 comments on different posts, at least 20 minutes apart"
    action_type: comment
    target_count: 2
    min_content_length: 15
    time_spacing_minutes: 20
    unique_root_post: true
    rewards:
      - type: mirage
        amount: 250

  - id: conversation_contributor
    title: "Conversation Contributor"
    description: "Leave 3 comments on different posts, each at least 30 minutes apart"
    action_type: comment
    target_count: 3
    min_content_length: 20
    time_spacing_minutes: 30
    unique_root_post: true
    rewards:
      - type: mirage
        amount: 750

  - id: thoughtful_commenter
    title: "Thoughtful Commenter"
    description: "Leave 2 detailed comments (50+ chars each), at least 45 minutes apart"
    action_type: comment
    target_count: 2
    min_content_length: 50
    time_spacing_minutes: 45
    unique_root_post: true
    rewards:
      - type: mirage
        amount: 500

  - id: topic_commenter
    title: "Topic Commenter"
    description: "Comment on posts in 3 different topics, at least 30 minutes apart"
    action_type: comment
    target_count: 3
    min_content_length: 15
    time_spacing_minutes: 30
    unique_root_post: true
    unique_topics_min: 3
    rewards:
      - type: mirage
        amount: 750

  # --- Post quests (reduced) ---
  - id: casual_poster
    title: "Casual Poster"
    description: "Create a post with 50+ characters"
    action_type: post
    target_count: 1
    min_content_length: 50
    rewards:
      - type: mirage
        amount: 250

  # --- Vote quests ---
  - id: quick_curator
    title: "Quick Curator"
    description: "Vote on 3 different posts, each at least 15 minutes apart"
    action_type: vote
    target_count: 3
    time_spacing_minutes: 15
    unique_target: true
    allow_self: false
    count_vote_changes: false
    rewards:
      - type: mirage
        amount: 250

  - id: community_curator
    title: "Community Curator"
    description: "Vote on 5 different posts across 2+ topics, each at least 10 minutes apart"
    action_type: vote
    target_count: 5
    time_spacing_minutes: 10
    unique_target: true
    unique_topics_min: 2
    allow_self: false
    count_vote_changes: false
    rewards:
      - type: mirage
        amount: 1000

  - id: balanced_voter
    title: "Balanced Voter"
    description: "Give 3 upvotes and 3 downvotes, each at least 15 minutes apart"
    action_type: balanced_vote
    target_upvotes: 3
    target_downvotes: 3
    time_spacing_minutes: 15
    unique_target: true
    allow_self: false
    count_vote_changes: false
    rewards:
      - type: mirage
        amount: 1000

